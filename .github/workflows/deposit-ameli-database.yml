name: Déposer la base Ameli intégrale en Git LFS

on:
  push:
    branches: [main]
    paths: [.github/workflows/deposit-ameli-database.yml]

permissions: {}

jobs:
  deposit:
    if: github.repository == 'Kajan94/site-amelie' && github.run_number == 1
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: 81535b7fbd2a7089d426f4338cf4ceae82bd581e
      DATABASE_OID: f23025c876465548c932d76de18b7c9769517a1b8049d72f8cd8a99feb4f850a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Copier et vérifier la base intégrale de database-amelie
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          source_dir="$(mktemp -d)"
          git -C "$source_dir" init
          git -C "$source_dir" remote add origin https://github.com/Kajan94/database-amelie.git
          GIT_LFS_SKIP_SMUDGE=1 git -C "$source_dir" fetch --depth=1 origin "$SOURCE_COMMIT"
          GIT_LFS_SKIP_SMUDGE=1 git -C "$source_dir" checkout --detach FETCH_HEAD
          git -C "$source_dir" lfs pull origin --include="ameli.db" --exclude=""
          mkdir -p model/data
          cp "$source_dir/ameli.db" model/data/ameli.db
          python - <<'PY'
          import hashlib, os, sqlite3
          from pathlib import Path
          database = Path('model/data/ameli.db')
          assert database.stat().st_size == 278020096
          with database.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == os.environ['DATABASE_OID']
          with sqlite3.connect(database.resolve().as_uri() + '?mode=ro', uri=True) as connection:
              assert connection.execute('PRAGMA integrity_check').fetchone() == ('ok',)
              tables = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert tables == {'Demographie', 'Departements', 'Honoraires', 'Prescriptions', 'ProfessionsSante', 'Regions'}
              assert connection.execute('SELECT MIN(Annee), MAX(Annee) FROM Prescriptions').fetchone() == (2010, 2023)
          print('Base intégrale vérifiée : toutes les tables et données sont conservées.')
          PY
      - name: Déposer uniquement le fichier vérifié dans le stockage Git LFS du site
        shell: bash
        run: |
          set -euo pipefail
          git lfs track model/data/ameli.db
          git add -- .gitattributes model/data/ameli.db
          git lfs push --object-id origin "$DATABASE_OID"
